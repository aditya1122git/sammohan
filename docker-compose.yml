name: sammohan

services:
  sammohan-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: sammohan-portal:latest
    container_name: sammohan-portal
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set in .env}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-sammohan}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    volumes:
      - sammohan-uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sammohan-uploads:
    driver: local
