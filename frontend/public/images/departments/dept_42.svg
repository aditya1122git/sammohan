<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad_42" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    
    <!-- Outer Golden Ring Gradient -->
    <linearGradient id="goldGrad_42" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow_42" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.35"/>
    </filter>

    <!-- Circular Path for Top Text: बिहार सरकार • GOVT OF BIHAR -->
    <path id="textArcTop_42" d="M 32 100 A 68 68 0 0 1 168 100" fill="none"/>
  </defs>

  <!-- Outer Seal Circle with Gold Rim -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad_42)" stroke="url(#goldGrad_42)" stroke-width="5" filter="url(#shadow_42)"/>

  <!-- Beaded Inner Border Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGrad_42)" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Arc Banner Text: बिहार सरकार • GOVT OF BIHAR -->
  <text font-family="'Mukta', 'Noto Sans Devanagari', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#fef08a" letter-spacing="1.2">
    <textPath href="#textArcTop_42" startOffset="50%" text-anchor="middle">
      बिहार सरकार • GOVT OF BIHAR
    </textPath>
  </text>

  <!-- Central Symbol / Heraldic Emblem -->
  <g filter="url(#shadow_42)">
    
            <!-- Microchip & Printed Circuit Tracks -->
            <rect x="80" y="80" width="40" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
            <!-- Chip Pins -->
            <line x1="88" y1="72" x2="88" y2="80" stroke="#fbbf24" stroke-width="2.5"/>
            <line x1="100" y1="72" x2="100" y2="80" stroke="#fbbf24" stroke-width="2.5"/>
            <line x1="112" y1="72" x2="112" y2="80" stroke="#fbbf24" stroke-width="2.5"/>
            <line x1="88" y1="120" x2="88" y2="128" stroke="#fbbf24" stroke-width="2.5"/>
            <line x1="100" y1="120" x2="100" y2="128" stroke="#fbbf24" stroke-width="2.5"/>
            <line x1="112" y1="120" x2="112" y2="128" stroke="#fbbf24" stroke-width="2.5"/>
            <circle cx="100" cy="100" r="6" fill="#38bdf8"/>
        
  </g>

  <!-- Bottom Department Ribbon Banner -->
  <g transform="translate(0, 0)">
    <!-- Banner Backdrop -->
    <path d="M 36 156 Q 100 176 164 156 L 158 178 Q 100 196 42 178 Z" fill="#0f172a" stroke="url(#goldGrad_42)" stroke-width="1.5"/>
    
    <!-- Department Code & Hindi Name Text -->
    <text x="100" y="172" font-family="'Mukta', 'Noto Sans Devanagari', Arial, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">
      सूचना प्रौद्योगिकी (IT)
    </text>
  </g>

  <!-- Number Badge at Bottom Center -->
  <circle cx="100" cy="186" r="8" fill="#d97706" stroke="#ffffff" stroke-width="1"/>
  <text x="100" y="189.5" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">
    42
  </text>
</svg>