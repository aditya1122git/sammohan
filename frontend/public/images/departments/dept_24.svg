<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad_24" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9d174d"/>
      <stop offset="100%" stop-color="#831843"/>
    </radialGradient>
    
    <!-- Outer Golden Ring Gradient -->
    <linearGradient id="goldGrad_24" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow_24" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.35"/>
    </filter>

    <!-- Circular Path for Top Text: बिहार सरकार • GOVT OF BIHAR -->
    <path id="textArcTop_24" d="M 32 100 A 68 68 0 0 1 168 100" fill="none"/>
  </defs>

  <!-- Outer Seal Circle with Gold Rim -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad_24)" stroke="url(#goldGrad_24)" stroke-width="5" filter="url(#shadow_24)"/>

  <!-- Beaded Inner Border Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGrad_24)" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Arc Banner Text: बिहार सरकार • GOVT OF BIHAR -->
  <text font-family="'Mukta', 'Noto Sans Devanagari', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#fef08a" letter-spacing="1.2">
    <textPath href="#textArcTop_24" startOffset="50%" text-anchor="middle">
      बिहार सरकार • GOVT OF BIHAR
    </textPath>
  </text>

  <!-- Central Symbol / Heraldic Emblem -->
  <g filter="url(#shadow_24)">
    
            <!-- Caring Hands & Family Silhouette -->
            <circle cx="100" cy="80" r="8" fill="#fbbf24"/>
            <path d="M88 108 C88 94 112 94 112 108 Z" fill="#fbbf24"/>
            <!-- Supporting Open Hands -->
            <path d="M68 124 Q78 138 100 138 Q122 138 132 124" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle cx="82" cy="94" r="5" fill="#f472b6"/>
            <circle cx="118" cy="94" r="5" fill="#f472b6"/>
        
  </g>

  <!-- Bottom Department Ribbon Banner -->
  <g transform="translate(0, 0)">
    <!-- Banner Backdrop -->
    <path d="M 36 156 Q 100 176 164 156 L 158 178 Q 100 196 42 178 Z" fill="#0f172a" stroke="url(#goldGrad_24)" stroke-width="1.5"/>
    
    <!-- Department Code & Hindi Name Text -->
    <text x="100" y="172" font-family="'Mukta', 'Noto Sans Devanagari', Arial, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">
      समाज कल्याण
    </text>
  </g>

  <!-- Number Badge at Bottom Center -->
  <circle cx="100" cy="186" r="8" fill="#d97706" stroke="#ffffff" stroke-width="1"/>
  <text x="100" y="189.5" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">
    24
  </text>
</svg>