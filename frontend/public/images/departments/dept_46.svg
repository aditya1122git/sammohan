<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad_46" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#831843"/>
    </radialGradient>
    
    <!-- Outer Golden Ring Gradient -->
    <linearGradient id="goldGrad_46" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow_46" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.35"/>
    </filter>

    <!-- Circular Path for Top Text: बिहार सरकार • GOVT OF BIHAR -->
    <path id="textArcTop_46" d="M 32 100 A 68 68 0 0 1 168 100" fill="none"/>
  </defs>

  <!-- Outer Seal Circle with Gold Rim -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad_46)" stroke="url(#goldGrad_46)" stroke-width="5" filter="url(#shadow_46)"/>

  <!-- Beaded Inner Border Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGrad_46)" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Arc Banner Text: बिहार सरकार • GOVT OF BIHAR -->
  <text font-family="'Mukta', 'Noto Sans Devanagari', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#fef08a" letter-spacing="1.2">
    <textPath href="#textArcTop_46" startOffset="50%" text-anchor="middle">
      बिहार सरकार • GOVT OF BIHAR
    </textPath>
  </text>

  <!-- Central Symbol / Heraldic Emblem -->
  <g filter="url(#shadow_46)">
    
            <!-- Madhubani Art Peacock & Palette -->
            <circle cx="100" cy="98" r="28" fill="#ffffff" stroke="#fbbf24" stroke-width="2.5"/>
            <path d="M86 86 C86 80 114 80 114 86 C114 92 86 92 86 86 Z" fill="#ec4899"/>
            <circle cx="92" cy="100" r="4" fill="#3b82f6"/>
            <circle cx="100" cy="106" r="4" fill="#eab308"/>
            <circle cx="108" cy="100" r="4" fill="#22c55e"/>
        
  </g>

  <!-- Bottom Department Ribbon Banner -->
  <g transform="translate(0, 0)">
    <!-- Banner Backdrop -->
    <path d="M 36 156 Q 100 176 164 156 L 158 178 Q 100 196 42 178 Z" fill="#0f172a" stroke="url(#goldGrad_46)" stroke-width="1.5"/>
    
    <!-- Department Code & Hindi Name Text -->
    <text x="100" y="172" font-family="'Mukta', 'Noto Sans Devanagari', Arial, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">
      कला, संस्कृति व युवा
    </text>
  </g>

  <!-- Number Badge at Bottom Center -->
  <circle cx="100" cy="186" r="8" fill="#d97706" stroke="#ffffff" stroke-width="1"/>
  <text x="100" y="189.5" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">
    46
  </text>
</svg>